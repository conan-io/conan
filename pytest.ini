[pytest]
norecursedirs = '.*', 'dist', 'CVS', '_darcs', '{arch}', '*.egg', 'venv', 'assets', 'build'
testpaths = 'test'
markers =
   docker_runner: Mark tests that require Docker to run.
   artifactory_ready: These tests can be run against a full Artifactory
   slow: Mark tests that are slow and may take longer to run.
filterwarnings =
    ignore:'cgi' is deprecated:DeprecationWarning
